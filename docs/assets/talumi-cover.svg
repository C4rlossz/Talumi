<title id="title">Talumi — Your money, with clarity.</title>
<desc id="desc">Original vector cover for Carlos Eduardo's Android portfolio project: a violet chip symbol and the words Finance, Investments, Kotlin, Compose, SQLite and MIT. Decorative illustration, not an app screenshot.</desc>
