<rect width="1280" height="440" rx="28" fill="url(#bg)"/>
<circle cx="1170" cy="36" r="250" fill="#B69AFF" opacity=".06"/><circle cx="1210" cy="410" r="310" fill="#7047EB" opacity=".12"/>
